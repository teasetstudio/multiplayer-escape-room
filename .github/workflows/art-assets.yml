name: Art assets
on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/client/public/assets/**'
      - 'docs/art/**'
      - 'scripts/*art*'
      - '.github/workflows/art-assets.yml'
permissions:
  contents: read
jobs:
  validate-art:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: corepack enable
      - run: corepack prepare pnpm@10.34.9 --activate
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install -r scripts/art-requirements.txt
      - run: python scripts/validate_art.py
      - run: node scripts/check-art-browser.mjs
        env:
          CHROME_BIN: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: art-validation
          path: |
            docs/art/validation.json
            docs/art/browser-validation.json
            docs/art/PHASER_SMOKE.png
